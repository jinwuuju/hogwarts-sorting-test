function copyRes(){const R=window.RES,H=HO[R.house],H2=HO[R.second],P=R.proto,po=POS[R.pos],fe=FEAR[R.fear],va=VAL[R.val],co=CORE[R.core],wd=WOOD[R.wood],cr=CAR[R.wood];
const tx=`[호그와트 기숙사 분류 결과 · 진우주 마법학교]\n기숙사: ${H.n} (${P.n}형 ${P.t}, ${R.sim}% 닮음)\n숨은 기숙사: ${H2.n}\n지팡이: ${wd[0]}, ${co[0]}, ${FLEX[R.fx]}\nO.W.L. 적성: ${R.sub[0][0]}, ${R.sub[1][0]}\n퀴디치: ${po[0]}\n보가트: ${fe[1]} → 리디큘러스! ${fe[2]}\n패트로누스: ${R.pat[0]}\n필요의 방: ${roomStr(R.rm)}\n소망의 거울: ${va[1]}\n마법 세계 직업: ${cr[0]} (${cr[1]})\n나만의 주문: ${fe[3]} ${va[3]} (${fe[4]}, ${va[4]})${R.stamps===3?'\n녹녹 VIP':''}`;
const ok=()=>{const m=$('cpm');if(m)m.textContent='복사했어요'},no=()=>{const m=$('cpm');if(m)m.textContent='이 브라우저에서는 복사가 막혀 있어요. 결과 화면을 캡처해 주세요.'};
const fb=()=>{const ta=document.createElement('textarea');ta.value=tx;ta.setAttribute('readonly','');ta.style.cssText='position:absolute;left:-9999px;top:0;font-size:16px';document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,ta.value.length);let done=false;try{done=document.execCommand('copy')}catch(e){}ta.remove();done?ok():no()};
if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(tx).then(ok).catch(fb);else fb()}
